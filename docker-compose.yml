
services:
  node_service:
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        PACKAGES : "nodejs"
        PORT : 3000
    volumes:
      - .:/workspace    
    ports:
      - "3000:3000"    

  npm_service:
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        PACKAGES : "npm" 
        PORT: "2000 4000"   
    volumes:
      - .:/workspace    
    ports:
      - "2000:2000"   
      - "4000:4000"   

  devcontainer:
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        PACKAGES : "git"  
        PORT : 5000  
    volumes:
      - .:/workspace    
    ports:
      - "5000:5000"         