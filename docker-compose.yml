services:
  node_service:
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        PACKAGES : "nodejs"
        PORT : 3000

  npm_service:
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        PACKAGES : "npm" 
        PORT: 3000     

  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        PACKAGES : "git"  
        PORT : 4000       